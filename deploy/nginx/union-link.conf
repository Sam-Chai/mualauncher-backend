# Include at http{} scope. Replace host and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=union_link_login:10m rate=10r/m;
server {
    listen 80;
    server_name link.example.com;
    return 308 https://link.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name link.example.com;
    ssl_certificate /etc/union-link/tls/fullchain.pem;
    ssl_certificate_key /etc/union-link/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 32m;
    # Source package bytes go directly to private object storage using signed PUT.
    location = /api/auth/login {
        limit_req zone=union_link_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/union-link/nginx-proxy.inc;
    }
    location / { include /etc/union-link/nginx-proxy.inc; }
}

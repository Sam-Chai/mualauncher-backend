# Replace domains and certificate paths before installing in sites-available.
server {
    listen 80;
    server_name link.example.com;
    return 301 https://link.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name link.example.com;
    ssl_certificate /etc/letsencrypt/live/link.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Pack binaries upload directly to OSS; Web only accepts control requests/images.
    client_max_body_size 32m;
    client_body_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}

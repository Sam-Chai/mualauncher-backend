<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">完整包与增量包的关系</title>
  <desc id="description">1.0 完整包提供基准内容，1.1 增量包提供从 1.0 到 1.1 的变化。校验基准并应用增量后，得到与直接使用 1.1 完整包一致的目标完整内容。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #142338; }
      .heading { font-size: 32px; font-weight: 700; fill: #142338; }
      .body { font-size: 24px; fill: #475569; }
      .small { font-size: 21px; fill: #64748b; }
      .label { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <rect x="32" y="32" width="1536" height="936" rx="28" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="88" y="112" class="title">完整包与增量包的关系</text>
  <text x="88" y="161" class="body">完整包提供全部目标内容；增量包复用基准内容，只补充版本之间的变化。</text>
  <text x="1500" y="105" text-anchor="end" class="label" fill="#64748b">Union Link</text>

  <!-- 基准完整包 -->
  <rect x="88" y="230" width="340" height="205" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="114" y="254" width="102" height="31" rx="8" fill="#dbeafe"/>
  <text x="165" y="276" text-anchor="middle" class="label" fill="#1d4ed8">基准版本</text>
  <text x="114" y="329" class="heading">1.0 完整包</text>
  <text x="114" y="376" class="body">包含 1.0 的全部目标内容</text>
  <text x="114" y="409" class="small">未变化的文件继续复用</text>

  <!-- 增量包 -->
  <text x="258" y="492" text-anchor="middle" font-size="48" fill="#94a3b8">+</text>
  <rect x="88" y="530" width="340" height="215" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="114" y="554" width="163" height="31" rx="8" fill="#ffedd5"/>
  <text x="195" y="576" text-anchor="middle" class="label" fill="#c2410c">基于 1.0 → 1.1</text>
  <text x="114" y="629" class="heading">1.1 增量包</text>
  <text x="114" y="675" class="body">变化记录 + 所需新增载荷</text>
  <text x="114" y="710" class="small">携带 1.1 的目标完整清单</text>

  <!-- 两个输入汇合到应用流程 -->
  <path d="M428 333H480V480H516" class="edge"/>
  <path d="M428 638H480V480" fill="none" stroke="#64748b" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="480" cy="480" r="6" fill="#64748b"/>
  <rect x="521" y="385" width="333" height="190" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="687" y="433" text-anchor="middle" class="label" fill="#64748b">更新路径</text>
  <text x="687" y="483" text-anchor="middle" class="heading">校验基准并应用增量</text>
  <text x="687" y="529" text-anchor="middle" class="body">复用旧内容，补齐新内容</text>
  <path d="M854 480H1007" class="edge"/>
  <text x="931" y="453" text-anchor="middle" class="small">更新完成</text>

  <!-- 直接使用目标完整包，作为等价路径 -->
  <rect x="1020" y="225" width="470" height="115" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="1255" y="270" text-anchor="middle" class="heading">1.1 完整包</text>
  <text x="1255" y="311" text-anchor="middle" class="body">直接提供 1.1 的全部目标内容</text>
  <path d="M1255 340V383" class="edge"/>
  <text x="1280" y="372" class="small">直接使用</text>

  <!-- 汇合后的同一目标 -->
  <rect x="1020" y="395" width="470" height="180" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <circle cx="1068" cy="441" r="17" fill="#16a34a"/>
  <path d="M1060 441L1066 447L1077 435" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1097" y="450" class="heading">1.1 完整内容</text>
  <text x="1047" y="498" class="body">两条路径得到同一目标版本</text>
  <rect x="1046" y="520" width="418" height="34" rx="8" fill="#dcfce7"/>
  <text x="1255" y="544" text-anchor="middle" font-size="22" font-weight="700" fill="#15803d">与 1.1 完整包的目标内容一致</text>

  <!-- 核心关系 -->
  <rect x="521" y="628" width="969" height="116" rx="18" fill="#f1f5f9"/>
  <text x="1005" y="673" text-anchor="middle" class="small">核心关系</text>
  <text x="1005" y="715" text-anchor="middle" font-size="31" font-weight="700" fill="#142338">1.0 完整包 + 1.1 增量包 → 1.1 完整内容</text>

  <line x1="88" y1="798" x2="1490" y2="798" stroke="#e2e8f0" stroke-width="2"/>
  <text x="88" y="840" class="small">增量包需要匹配的 1.0 基准及摘要；仅凭版本号不能确认是否可以应用。</text>
  <text x="88" y="879" class="small">内容等价不要求 ZIP 字节相同；玩家文件与 preserve 文件按既定策略保留。</text>
  <text x="88" y="918" class="small">v2 的完整内容包含本地文件、远程下载声明与环境要求；远程文件和环境由 Launcher 补齐。</text>
</svg>
